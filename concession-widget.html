<html lang="en">

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:       #5c6bc0;
      --brand-dark:  #3949ab;
      --brand-light: #e8eaf6;
      --success:     #2e7d32;
      --success-bg:  #e8f5e9;
      --warn:        #e65100;
      --warn-bg:     #fff3e0;
      --danger:      #c62828;
      --danger-bg:   #ffebee;
      --neutral:     #546e7a;
      --neutral-bg:  #eceff1;
      --border:      #cfd8dc;
      --surface:     #ffffff;
      --bg:          #f5f6fa;
      --text:        #263238;
      --text-muted:  #607d8b;
      --radius:      6px;
      --shadow:      0 1px 4px rgba(0,0,0,.12);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    #sidebar {
      width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      background: var(--brand);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header .logo { font-size: 18px; }
    .sidebar-header h1 { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
    .sidebar-header .subtitle { font-size: 11px; opacity: .8; margin-top: 1px; }
    .lookup-bar {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--brand-light);
      display: flex;
      gap: 6px;
    }
    .lookup-bar input {
      flex: 1; padding: 6px 9px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 12px; outline: none; background: #fff;
    }
    .lookup-bar input:focus { border-color: var(--brand); }
    .lookup-bar button {
      padding: 6px 11px; background: var(--brand); color: #fff;
      border: none; border-radius: var(--radius); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .lookup-bar button:hover { background: var(--brand-dark); }
    #content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .card-header {
      padding: 7px 10px; background: var(--neutral-bg); border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
      color: var(--neutral); display: flex; align-items: center; gap: 5px;
    }
    .card-body { padding: 10px; }

    /* Customer */
    .customer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--brand);
      color: #fff; font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .customer-name { font-weight: 700; font-size: 14px; }
    .customer-email { color: var(--text-muted); font-size: 11px; margin-top: 1px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .stat-box { background: var(--bg); border-radius: var(--radius); padding: 7px 8px; text-align: center; }
    .stat-box .val { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
    .stat-box .lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* Tier badges */
    .tier-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700;
    }
    .tier-none     { background: var(--neutral-bg); color: var(--neutral); }
    .tier-ship     { background: #e3f2fd; color: #1565c0; }
    .tier-five     { background: var(--warn-bg); color: var(--warn); }
    .tier-ten      { background: var(--success-bg); color: var(--success); }

    /* Banners */
    .banner { padding: 8px 10px; border-radius: var(--radius); font-size: 12px; line-height: 1.5; display: flex; gap: 7px; align-items: flex-start; }
    .banner-warn    { background: var(--warn-bg); color: var(--warn); border: 1px solid #ffcc80; }
    .banner-info    { background: var(--brand-light); color: var(--brand-dark); border: 1px solid #9fa8da; }
    .banner-success { background: var(--success-bg); color: var(--success); border: 1px solid #a5d6a7; }
    .banner-icon    { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    /* Order table */
    .order-table { width: 100%; border-collapse: collapse; }
    .order-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    .order-table td { padding: 5px 6px; font-size: 11px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    .order-table tr:last-child td { border-bottom: none; }
    .order-table tr.ticket-order td { background: #faffd7; }
    .issue-tag { display: inline-block; background: var(--danger-bg); color: var(--danger); border-radius: 3px; padding: 1px 5px; font-size: 10px; }
    .ok-tag    { display: inline-block; background: var(--success-bg); color: var(--success); border-radius: 3px; padding: 1px 5px; font-size: 10px; }

    /* Metafield display */
    .metafield-box {
      background: #1e2228; color: #c9d1d9; border-radius: var(--radius);
      padding: 10px; font-family: "SF Mono","Fira Code",monospace; font-size: 11px; line-height: 1.7;
      white-space: pre; overflow-x: auto;
    }
    .mf-key   { color: #79c0ff; }
    .mf-num   { color: #f8cc6f; }
    .mf-str   { color: #a5d6ff; }
    .mf-date  { color: #7ee787; }
    .mf-new   { color: #ff7b72; font-weight: 700; }

    /* Code block */
    .code-block {
      background: var(--bg); border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .code-text { font-family: "SF Mono","Fira Code",monospace; font-size: 15px; font-weight: 700; color: var(--brand-dark); letter-spacing: 1.5px; }
    .copy-btn { padding: 4px 8px; font-size: 11px; background: var(--brand); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .copy-btn:hover { background: var(--brand-dark); }

    /* Macro */
    .macro-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 9px; font-size: 12px; line-height: 1.6; color: var(--text);
      white-space: pre-wrap; max-height: 140px; overflow-y: auto;
    }
    .macro-highlight { background: #fffde7; border-radius: 2px; padding: 0 3px; font-weight: 700; font-family: monospace; color: var(--brand-dark); }

    /* Action buttons */
    .action-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 9px 12px; border-radius: var(--radius); font-size: 12px; font-weight: 600;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 100px;
    }
    .btn-primary   { background: var(--brand); color: #fff; }
    .btn-primary:hover   { background: var(--brand-dark); }
    .btn-success   { background: var(--success); color: #fff; }
    .btn-success:hover   { background: #1b5e20; }
    .btn-secondary { background: var(--neutral-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #dde2e5; }
    .btn:disabled  { opacity: .4; cursor: not-allowed; }

    /* Log */
    .log-entry { font-size: 11px; padding: 5px 7px; background: var(--bg); border-radius: 4px; margin-bottom: 4px; border-left: 3px solid var(--border); line-height: 1.5; }
    .log-entry.success { border-left-color: var(--success); }
    .log-entry.warn    { border-left-color: var(--warn); }
    .log-time { color: var(--text-muted); font-size: 10px; }

    /* Poor exp summary table */
    .exp-table { width: 100%; border-collapse: collapse; }
    .exp-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    .exp-table td { padding: 5px 6px; font-size: 12px; border-bottom: 1px solid #f0f0f0; }
    .exp-table tr:last-child td { border-bottom: none; }
    .count-chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; font-weight: 700; font-size: 12px;
    }
    .count-active { background: var(--danger-bg); color: var(--danger); }
    .count-warn   { background: var(--warn-bg); color: var(--warn); }
    .count-zero   { background: var(--neutral-bg); color: var(--text-muted); }
    .triggers-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
    .triggers-yes    { background: var(--danger-bg); color: var(--danger); }
    .triggers-no     { background: var(--neutral-bg); color: var(--text-muted); }
    .triggers-review { background: var(--warn-bg); color: var(--warn); }
    .triggers-threshold { background: var(--warn-bg); color: var(--warn); }

    /* Step indicators */
    .step-indicator {
      display: flex; gap: 0; margin-bottom: 2px;
    }
    .step {
      flex: 1; padding: 7px 6px; text-align: center; font-size: 11px; font-weight: 600;
      border-bottom: 3px solid var(--border); color: var(--text-muted);
    }
    .step.active { border-bottom-color: var(--brand); color: var(--brand-dark); }
    .step.done   { border-bottom-color: var(--success); color: var(--success); }

    /* Demo chips */
    .demo-bar { padding: 8px 12px; background: #fff8e1; border-bottom: 1px solid #ffe082; font-size: 11px; color: #5d4037; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .demo-bar span { font-weight: 700; }
    .demo-chip { padding: 3px 8px; border-radius: 12px; background: #fff; border: 1px solid #ffe082; cursor: pointer; font-size: 11px; }
    .demo-chip:hover, .demo-chip.active { background: #ffe082; font-weight: 600; }

    /* Empty state */
    .empty-state { text-align: center; padding: 30px 20px; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; line-height: 1.5; }

    /* Note textarea */
    .operator-note {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 12px; resize: vertical; outline: none; font-family: inherit;
    }
    .operator-note:focus { border-color: var(--brand); }

    /* Approval note for macro */
    .approval-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
  </style>
</head>

//   - wrong_item: floor(count / 3) = eligible instances
//   - poor_store_experience: never triggers, counter only
//   - Base tier from current ticket's order value:
//       < $20 → no concession
//       $20–$75 → free shipping
//       $75–$250 → $5 discount
//       $250+ → $10 discount
//   - Each additional instance beyond the first → bump up one tier
//   - Tier ladder: none → free_shipping → discount_5 → discount_10
// ═══════════════════════════════════════════════════════════════════

const TIERS = [
  { id: "none",      label: "No Concession",  discountType: "none",         discountValue: 0,  badge: "tier-none", icon: "⬜" },
  { id: "ship",      label: "Free Shipping",  discountType: "free_shipping",discountValue: 0,  badge: "tier-ship", icon: "🚚" },
  { id: "five",      label: "$5 Discount",    discountType: "fixed",        discountValue: 5,  badge: "tier-five", icon: "🟠" },
  { id: "ten",       label: "$10 Discount",   discountType: "fixed",        discountValue: 10, badge: "tier-ten",  icon: "🟢" },
];

function calculateTier(customer) {
  const { poor_experience_summary, orders, currentTicketContext } = customer;
  const bd = poor_experience_summary.breakdown;

  // Count eligible instances per type
  const canceledInstances      = bd.canceled_order.count;              // each = 1
  const canceledItemInstances  = bd.canceled_item.count;               // each = 1
  const missingOrderInstances  = bd.missing_order.count;               // each = 1 (post fraud review only)
  const missingItemInstances   = bd.missing_item.count;                // each = 1 (post fraud review only)
  const wrongItemInstances     = Math.floor(bd.wrong_item.count / 3);  // every 3 = 1
  // poor_store_experience never triggers directly
  const totalEligible = canceledInstances + canceledItemInstances + missingOrderInstances + missingItemInstances + wrongItemInstances;

  // Determine primary triggering type for display + note
  let triggeringType = null;
  if (canceledInstances > 0)           triggeringType = "canceled_order";
  else if (canceledItemInstances > 0)  triggeringType = "canceled_item";
  else if (missingOrderInstances > 0)  triggeringType = "missing_order";
  else if (missingItemInstances > 0)   triggeringType = "missing_item";
  else if (wrongItemInstances > 0)     triggeringType = "wrong_item";

  if (totalEligible === 0) {
    return {
      tierIndex: 0,
      tier: TIERS[0],
      totalEligible: 0,
      triggeringType: null,
      baseIndex: 0,
      bumps: 0,
      reason: bd.poor_store_experience.count > 0
        ? `${bd.poor_store_experience.count} poor store experience(s) logged, but this type never directly triggers a concession.`
        : "No triggering poor experience types found (canceled_order, canceled_item, or wrong_item required).",
    };
  }

  // Base tier from current order value
  const ticketOrder = orders.find(o => o.id === currentTicketContext.orderId) || orders[0];
  const val = ticketOrder.total;
  let baseIndex;
  if      (val < 20)  baseIndex = 0;   // none
  else if (val <= 75) baseIndex = 1;   // free shipping
  else if (val <= 250) baseIndex = 2;  // $5
  else                 baseIndex = 3;  // $10

  const bumps = totalEligible - 1;
  const finalIndex = Math.min(baseIndex + bumps, 3);

  // Edge: order < $20 with 1 instance stays at none (baseIndex 0, no bump needed)
  // With 2+ instances it bumps up from none

  const tier = TIERS[finalIndex];
  const lines = [];
  if (val < 20)  lines.push(`Order $${val} < $20 → base: no concession`);
  else if (val <= 75)  lines.push(`Order $${val} ($20–$75) → base: free shipping`);
  else if (val <= 250) lines.push(`Order $${val} ($75–$250) → base: $5 discount`);
  else                 lines.push(`Order $${val} (>$250) → base: $10 discount`);

  if (bumps > 0) lines.push(`+${bumps} bump${bumps>1?"s":""} from ${totalEligible} eligible instances → ${tier.label}`);

  return {
    tierIndex: finalIndex,
    tier,
    totalEligible,
    triggeringType,
    baseIndex,
    bumps,
    orderValue: val,
    ticketOrder,
    reason: lines.join(" · "),
  };
}

function fmtDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function nowTime() {
  return new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
}

      <div class="card">
        <div class="card-header">📦 Updated Metafield</div>
        <div class="card-body" style="padding:0">
          <div class="metafield-box">${formatMetafieldAfterIssue(c, tr, currentCode)}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">📝 Appended Order Note</div>
        <div class="card-body">
          <div style="font-family:monospace;font-size:11px;background:var(--bg);padding:8px;border-radius:var(--radius);border:1px solid var(--border);word-break:break-all">${orderNote}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">🎟️ Issued Code</div>
        <div class="card-body">
          <div class="code-block">
            <span class="code-text">${currentCode}</span>
            <button class="copy-btn" onclick="copyText('${currentCode}','code')">📋 Copy</button>
          </div>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="resetWidget()" style="width:100%">↩ New customer</button>
      ${renderLog()}`;
  }

  // ── Step progress bar ──
  const steps = [
    { label: "Load", done: true },
    { label: "Generate", done: state === "code_generated" || state === "issued" },
    { label: "Approve", done: state === "issued" },
  ];
  const stepBar = `<div class="step-indicator">
    ${steps.map((s, i) => {
      const cls = s.done ? "step done" : (
        (i === 1 && state === "loaded") ||
        (i === 2 && state === "code_generated") ? "step active" : "step"
      );
      return `<div class="${cls}">${s.done && i < (state === "issued" ? 3 : state === "code_generated" ? 2 : 1) ? "✓ " : ""}${s.label}</div>`;
    }).join("")}
  </div>`;

  content.innerHTML = `

    ${stepBar}

    <div class="card">
      <div class="card-header">👤 Customer · <span style="font-weight:400">${c.segment}</span></div>
      <div class="card-body">
        <div class="customer-row">
          <div class="avatar">${c.name.split(" ").map(n=>n[0]).join("")}</div>
          <div>
            <div class="customer-name">${c.name}</div>
            <div class="customer-email">${c.email} · since ${fmtDate(c.since)}</div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="val">$${c.ltv.toLocaleString()}</div><div class="lbl">LTV</div></div>
          <div class="stat-box"><div class="val">${c.orderCount}</div><div class="lbl">Orders</div></div>
          <div class="stat-box"><div class="val">${c.poor_experience_summary.total}</div><div class="lbl">Total Issues</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">🎫 Ticket · ${ticketCtx.ticketId}</div>
      <div class="card-body" style="font-size:12px;display:flex;flex-direction:column;gap:3px">
        <div><strong>Order:</strong> ${ticketCtx.orderId} — $${ticketOrder.total.toFixed(2)}</div>
        <div><strong>Issue type:</strong> ${ticketCtx.issueType?.replace(/_/g," ") || "—"}</div>
        <div><strong>Channel:</strong> ${ticketCtx.channel}</div>
      </div>
    </div>

    ${recentBanner}

    <div class="card">
      <div class="card-header">⚡ Poor Experience Summary</div>
      <div class="card-body" style="padding:0">${expTable}</div>
    </div>

    <div class="card">
      <div class="card-header">📦 Poor Experience Orders · 🎫 = ticket order</div>
      <div class="card-body" style="padding:0">
        <table class="order-table">
          <thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Issue</th></tr></thead>
          <tbody>${orderRows}</tbody>
        </table>
      </div>
    </div>

    ${c.concession_history.length > 0 ? `
    <div class="card">
      <div class="card-header">🎁 Concession History</div>
      <div class="card-body" style="padding:0">
        <table class="order-table">
          <thead><tr><th>Date</th><th>Code</th><th>Type</th><th>Reason</th><th>Operator</th></tr></thead>
          <tbody>
            ${c.concession_history.map(h => `
            <tr>
              <td>${fmtDate(h.date)}</td>
              <td><span style="font-family:monospace;font-size:11px">${h.code}</span></td>
              <td>${h.type}</td>
              <td style="color:var(--text-muted);font-size:11px">${h.reason}</td>
              <td style="color:var(--text-muted);font-size:11px">${h.operator || "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>` : ""}

    <div class="card">
      <div class="card-header">📊 Current Metafield</div>
      <div class="card-body" style="padding:0">
        <div class="metafield-box">${formatMetafield(c.poor_experience_summary)}</div>
      </div>
    </div>

    ${bottomSection}
  `;
}

function renderLog() {
  if (!SESSION_LOG.length) return "";
  const items = [...SESSION_LOG].reverse().map(e =>
    `<div class="log-entry ${e.type}"><span class="log-time">${e.time}</span>  ${e.msg}</div>`
  ).join("");
  return `<div class="card">
    <div class="card-header">📋 Session Log</div>
    <div class="card-body" style="padding:8px">${items}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════

function markFraudReviewCleared() {
  const c = currentCustomer;
  const issueType = c.currentTicketContext.issueType; // missing_order or missing_item
  const bd = c.poor_experience_summary.breakdown;

  // Increment the count and set last_occurrence for this type
  bd[issueType].count += 1;
  bd[issueType].last_occurrence = TODAY;
  c.poor_experience_summary.total += 1;
  if (!c.poor_experience_summary.last_occurrence || TODAY > c.poor_experience_summary.last_occurrence) {
    c.poor_experience_summary.last_occurrence = TODAY;
  }

  fraudReviewCleared = true;
  currentTierResult = calculateTier(c);

  logEvent("success", `[Fraud review cleared] ${issueType.replace(/_/g," ")} confirmed for ${c.name} · Ticket ${c.currentTicketContext.ticketId} · ${issueType} count now ${bd[issueType].count}`);
  renderWidget();
}

function loadCustomer(emailOverride) {
  const email = (emailOverride || document.getElementById("email-input").value.trim()).toLowerCase();
  const c = CUSTOMERS[email];
  if (!c) { alert(`No profile for "${email}". Try a demo chip.`); return; }
  currentCustomer    = c;
  currentTierResult  = calculateTier(c);
  currentCode        = null;
  fraudReviewCleared = false;
  state              = "loaded";
  document.getElementById("email-input").value = email;
  logEvent("info", `Loaded: ${c.name} (${email}) · Ticket ${c.currentTicketContext.ticketId}`);
  renderWidget();
}

function makeDiscountCode(customer, tier) {
  if (tier.id === "none") return null;
  const prefix = { ship: "SHIP", five: "SAVE5", ten: "SAVE10" }[tier.id] || "CODE";
  const name = customer.name.split(" ")[0].toUpperCase().slice(0, 4);
  const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
  return `${prefix}${name}${rand}`;
}

function generateCode() {
  currentCode = makeDiscountCode(currentCustomer, currentTierResult.tier);
  state = "code_generated";
  logEvent("success", `[Shopify mock] Discount code created: ${currentCode} (${currentTierResult.tier.label}) · single-use · restricted to ${currentCustomer.email}`);
  logEvent("info", `[Gorgias] Macro "${currentTierResult.triggeringType}" pre-filled with ${currentCode} — awaiting CX approval`);
  renderWidget();
}

function approveAndLog() {
  const operatorNote = document.getElementById("operator-note")?.value?.trim() || "";
  const c = currentCustomer;
  const tr = currentTierResult;
  const ticketCtx = c.currentTicketContext;
  const ticketOrder = c.orders.find(o => o.id === ticketCtx.orderId) || c.orders[0];
  const orderNote = buildOrderNote(ticketOrder, ticketCtx.issueType, tr.tier, currentCode, ticketCtx.ticketId);

  logEvent("success", `[Shopify metafield] concession_issued written for ${c.name} · code: ${currentCode} · tier: ${tr.tier.label} · ticket: ${ticketCtx.ticketId}${operatorNote ? ` · note: "${operatorNote}"` : ""}`);
  logEvent("success", `[Shopify order note] Appended to ${ticketOrder.id}: ${orderNote}`);
  logEvent("success", `[Gorgias] Macro inserted into reply editor for ${ticketCtx.ticketId}`);
  logEvent("warn",    `[Shopify metafield] concession_recently_issued flag SET for ${c.name} · suppresses auto-suggest for 30 days`);

  state = "issued";
  renderWidget();
}

function copyText(text, type) {
  navigator.clipboard.writeText(text).then(() => {
    logEvent("info", `Copied ${type} to clipboard: ${text}`);
    renderWidget();
  });
}

function copyMacroText() {
  const box = document.querySelector(".macro-box");
  if (!box) return;
  navigator.clipboard.writeText(box.innerText).then(() => {
    logEvent("info", "Macro text copied to clipboard.");
    renderWidget();
  });
}

function resetWidget() {
  currentCustomer = null; currentTierResult = null; currentCode = null; state = "idle";
  document.getElementById("email-input").value = "";
  renderWidget();
}

// ═══════════════════════════════════════════════════════════════════
// DEMO CHIPS
// ═══════════════════════════════════════════════════════════════════

function buildDemoChips() {
  const container = document.getElementById("demo-chips");
  const labels = {
    "cust_001": "VIP · 1st issue",
    "cust_002": "Mid · 2 types",
    "cust_003": "New · 1st issue",
    "cust_004": "VIP · Recent ⚠️",
    "cust_005": "No concession",
    "cust_006": "Fraud review gate",
  };
  Object.values(CUSTOMERS).forEach(c => {
    const chip = document.createElement("button");
    chip.className = "demo-chip";
    chip.textContent = labels[c.id] || c.name;
    chip.onclick = () => {
      document.querySelectorAll(".demo-chip").forEach(el => el.classList.remove("active"));
      chip.classList.add("active");
      loadCustomer(c.email);
    };
    container.appendChild(chip);
  });
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════

buildDemoChips();
renderWidget();

document.getElementById("email-input").addEventListener("keydown", e => {
  if (e.key === "Enter") loadCustomer();
});
</script>
